name: CI

on:
  push:
    branches: [yolo]
  pull_request:
    branches: [yolo]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            name: macOS Intel
            target: x86_64-macos
          - os: macos-14
            name: macOS ARM
            target: aarch64-macos
          - os: ubuntu-latest
            name: Linux Intel
            target: x86_64-linux
          - os: ubuntu-24.04-arm
            name: Linux ARM
            target: aarch64-linux
          - os: windows-latest
            name: Windows Intel
            target: x86_64-windows

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build
        run: zig build

      - name: Test
        run: zig build test
